# Data Lake — an application from us beside the Business OS kernel. Rendered by the kernel's installer (bin/app_install.php):
# {{APP_FQDN}} = datalake.<domain> (the vhost label and the catalog key are both datalake), {{APP_DIR}} = /srv/apps/datalake, the ports
# from config/.env. Two virtual hosts: the public name for people (and the proxied MCP servers and the key-checked token API), and a
# loopback port for the kernel's actions server and approval replays.
#
# THE PUBLIC ALLOW-LIST (design §8, §14): /api/v1/ (the health check and the token API — a person's key, rate-limited and logged by the
# handler), /mcp/records, /mcp/activity. There is NO door for anyone without an account or a key (no auth_kind none): the lake has no
# public link. Every screen behind them needs the kernel's sign-on.
# The data directory (DL_STORAGE_DIR, /srv/lake) is NEVER under the web root, and the web application's user cannot read its lake/:
# every row a person reads comes from the query service (design §3 rule 5), every upload goes in 8 MB parts into landing/.
# The per-request ceiling covers one upload part (8 MB) with room to spare and the API's one-request upload (64 MB, design §8).

<VirtualHost *:80>
	ServerName {{APP_FQDN}}
	DocumentRoot {{APP_DIR}}/html
	ErrorLog ${APACHE_LOG_DIR}/datalake-error.log
	CustomLog ${APACHE_LOG_DIR}/datalake-access.log combined
	SetEnvIf X-Forwarded-Proto "https" HTTPS=on
	LimitRequestBody 73400320
	<IfModule mod_headers.c>
		Header always set X-Content-Type-Options "nosniff"
		Header always set X-Frame-Options "SAMEORIGIN"
	</IfModule>

	<Directory {{APP_DIR}}/html>
		Options -Indexes +FollowSymLinks
		AllowOverride None
		Require all granted
		# An upload part (8 MB) or the API's one-request upload (64 MB); the SQL editor waits for the query service (≤ 30 s a screen, design D7)
		php_admin_value upload_max_filesize 64M
		php_admin_value post_max_size 72M
		php_admin_value max_execution_time 120
		php_admin_value memory_limit 256M
	</Directory>

	# The two read MCP servers, under the application's name. Host is NOT preserved (the SDK's DNS-rebinding guard checks it
	# against loopback). Bearer auth is the servers' own (a person's token, the tenant's run token, or the kernel's).
	ProxyPreserveHost Off
	ProxyPass        /mcp/records  http://127.0.0.1:{{MCP_RECORDS_PORT}}/mcp
	ProxyPassReverse /mcp/records  http://127.0.0.1:{{MCP_RECORDS_PORT}}/mcp
	ProxyPass        /mcp/activity http://127.0.0.1:{{MCP_ACTIVITY_PORT}}/mcp
	ProxyPassReverse /mcp/activity http://127.0.0.1:{{MCP_ACTIVITY_PORT}}/mcp

	RewriteEngine On
	RewriteRule ^/mcp/(records|activity)(/|$) - [L]

	# The token API (design §8; bearer = a person's key acting as them):
	#   GET /api/v1/datasets?q=   GET /api/v1/datasets/{key}[/columns|health|lineage|contract.odcs.yaml]   GET /api/v1/datasets/{key}/rows?page=
	#   POST /api/v1/queries/{id}/run   POST /api/v1/metrics/{name}   POST /api/v1/sql   POST /api/v1/upload   GET /api/v1/lineage/events
	# A dataset key is <zone>.<name>. Nothing else answers under /api.
	RewriteRule ^/api/v1/health/?$ /api/v1/health.php [L,QSA]
	RewriteRule ^/api/v1/datasets/?$ /api/v1/datasets.php [L,QSA]
	RewriteRule ^/api/v1/datasets/([a-z][a-z0-9_]*\.[a-z][a-z0-9_]*)/contract\.odcs\.yaml$ /api/v1/datasets.php?key=$1&do=contract [L,QSA]
	RewriteRule ^/api/v1/datasets/([a-z][a-z0-9_]*\.[a-z][a-z0-9_]*)(?:/(columns|health|lineage|rows))?/?$ /api/v1/datasets.php?key=$1&do=$2 [L,QSA]
	RewriteRule ^/api/v1/queries/([0-9]+)/run/?$ /api/v1/queries.php?id=$1&do=run [L,QSA]
	RewriteRule ^/api/v1/metrics/([a-z][a-z0-9_]*)/?$ /api/v1/metrics.php?name=$1 [L,QSA]
	RewriteRule ^/api/v1/(sql|upload)/?$ /api/v1/$1.php [L,QSA]
	RewriteRule ^/api/v1/lineage/events/?$ /api/v1/lineage.php?do=events [L,QSA]
	RewriteRule ^/api/v1/[a-z_-]+\.php$ - [L]
	RewriteRule ^/api/ - [R=404,L]

	# The sign-on receivers.
	RewriteRule ^/sso$ /sso.php [L,QSA]
	RewriteRule ^/sso/logout$ /sso/logout.php [L,QSA]

	# The routing form: an upload in parts; a column of a dataset and its edit form (/datasets/{id|key}/columns/{name}[/edit], slice 1); a dataset's
	# edit form by its key; a dataset by its key and a tab (/datasets/curated.sales_orders/quality). A key names its zone, so a handler beside
	# them (/datasets/save.php) is never taken for a key — slice 1 found that /datasets/save.php matched the looser rule under Apache.
	RewriteRule ^/upload/(start|part|finish)$ /upload/$1.php [L,QSA]
	RewriteRule ^/datasets/([0-9]+|(?:raw|curated|product|sandbox)\.[a-z][a-z0-9_]*)/columns/([A-Za-z0-9_]+)/edit/?$ /datasets/columns/form.php?ref=$1&column=$2 [L,QSA]
	RewriteRule ^/datasets/([0-9]+|(?:raw|curated|product|sandbox)\.[a-z][a-z0-9_]*)/columns/([A-Za-z0-9_]+)/?$ /datasets/columns/view.php?ref=$1&column=$2 [L,QSA]
	RewriteRule ^/datasets/((?:raw|curated|product|sandbox)\.[a-z][a-z0-9_]*)/edit/?$ /datasets/form.php?key=$1 [L,QSA]
	RewriteRule ^/datasets/((?:raw|curated|product|sandbox)\.[a-z][a-z0-9_]*)(?:/([a-z_-]+))?/?$ /datasets/view.php?key=$1&tab=$2 [L,QSA]

	RewriteCond %{DOCUMENT_ROOT}/$1/$3.php -f
	RewriteRule ^/(.+)/([0-9]+)/([a-z_-]+)$ /$1/$3.php?id=$2 [L,QSA]

	# Canonical URLs (the action manifest, Phase 1): /x/new -> form.php, /x/{id}/edit -> form.php?id=, /x/{id} -> view.php?id=.
	RewriteCond %{DOCUMENT_ROOT}/$1/form.php -f
	RewriteRule ^/(.+)/new$ /$1/form.php [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1/form.php -f
	RewriteRule ^/(.+)/([0-9]+)/edit$ /$1/form.php?id=$2 [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1/view.php -f
	RewriteRule ^/(.+)/([0-9]+)$ /$1/view.php?id=$2 [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1.php -f
	RewriteRule ^/(.+?)/?$ /$1.php [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1/index.php -f
	RewriteRule ^/(.+[^/])$ /$1/index.php [L,QSA]
</VirtualHost>

# PHP on the internal port, for the kernel's actions server and approval replays only.
Listen 127.0.0.1:{{APP_INTERNAL_PORT}}
<VirtualHost 127.0.0.1:{{APP_INTERNAL_PORT}}>
	DocumentRoot {{APP_DIR}}/html
	ErrorLog ${APACHE_LOG_DIR}/datalake-error.log
	CustomLog ${APACHE_LOG_DIR}/datalake-access.log combined
	LimitRequestBody 73400320
	<IfModule mod_headers.c>
		Header always set X-Content-Type-Options "nosniff"
	</IfModule>
	<Directory {{APP_DIR}}/html>
		Options -Indexes +FollowSymLinks
		AllowOverride None
		Require all granted
		php_admin_value upload_max_filesize 64M
		php_admin_value post_max_size 72M
		php_admin_value max_execution_time 120
		php_admin_value memory_limit 256M
	</Directory>
	RewriteEngine On
	RewriteRule ^/api/v1/health/?$ /api/v1/health.php [L,QSA]
	RewriteRule ^/datasets/([0-9]+|(?:raw|curated|product|sandbox)\.[a-z][a-z0-9_]*)/columns/([A-Za-z0-9_]+)/edit/?$ /datasets/columns/form.php?ref=$1&column=$2 [L,QSA]
	RewriteRule ^/datasets/([0-9]+|(?:raw|curated|product|sandbox)\.[a-z][a-z0-9_]*)/columns/([A-Za-z0-9_]+)/?$ /datasets/columns/view.php?ref=$1&column=$2 [L,QSA]
	RewriteRule ^/datasets/((?:raw|curated|product|sandbox)\.[a-z][a-z0-9_]*)/edit/?$ /datasets/form.php?key=$1 [L,QSA]
	RewriteRule ^/datasets/((?:raw|curated|product|sandbox)\.[a-z][a-z0-9_]*)(?:/([a-z_-]+))?/?$ /datasets/view.php?key=$1&tab=$2 [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1/$3.php -f
	RewriteRule ^/(.+)/([0-9]+)/([a-z_-]+)$ /$1/$3.php?id=$2 [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1/form.php -f
	RewriteRule ^/(.+)/new$ /$1/form.php [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1/form.php -f
	RewriteRule ^/(.+)/([0-9]+)/edit$ /$1/form.php?id=$2 [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1/view.php -f
	RewriteRule ^/(.+)/([0-9]+)$ /$1/view.php?id=$2 [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1.php -f
	RewriteRule ^/(.+?)/?$ /$1.php [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1/index.php -f
	RewriteRule ^/(.+[^/])$ /$1/index.php [L,QSA]
</VirtualHost>
